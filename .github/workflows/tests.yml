name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The locked packages without the CUDA stack: torch from the CPU index,
      # TensorRT and cuda-python left out (TensorRT is only imported when a TRT model runs).
      - name: Install dependencies
        shell: bash
        run: |
          uv venv --python 3.12
          uv export --locked --no-hashes --no-annotate --no-emit-project --format requirements-txt \
            | grep -v -E '^(-|torch|tensorrt|cuda-|nvidia-)' > requirements-ci.txt
          uv pip install -r requirements-ci.txt
          uv pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Unit tests
        shell: bash
        run: |
          status=0
          for dir in modules/settings modules/utils modules/pose modules/tracker modules/oak modules/render apps/white_space; do
            echo "::group::$dir"
            .venv/Scripts/python -m unittest discover -s "$dir/tests" -t . || status=1
            echo "::endgroup::"
          done
          exit $status
