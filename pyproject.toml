[project]
name = "poser2"
version = "0.0.0"
description = "Real-time installations: White Space, HD Trio, Deep Flow, SMILE"
requires-python = "==3.12.*"
# Lower bounds only: `uv lock --upgrade` moves uv.lock to the newest versions that fit together.
# Exact pins are the exceptions, each with its reason.
dependencies = [
    "aiohttp>=3.14",                # SMILE Online's relay, when it runs on the PC (apps/smile/relay)
    "ffmpeg-python>=0.2",
    "freetype-py>=2.5",
    "glfw>=2.10",
    "h5py>=3.16",
    "nicegui>=3.11",
    "numpy>=2.4",
    "OneEuroFilter>=0.2.1",
    "onnx>=1.21",                   # model export tools
    "onnx_simplifier>=0.5",         # model export tools, optional there
    "onnxruntime-gpu>=1.27",        # the ONNX runners, to benchmark TensorRT against; 1.27+ is a CUDA 13 build like torch
    "opencv-python>=4.13",
    "psutil>=7.2",
    "PyOpenGL>=3.1.10",
    "PyOpenGL-accelerate>=3.1.10",
    "python-osc>=1.10",
    "pytweening>=1.2",
    "requests>=2.34",               # SMILE: ComfyUI's HTTP API
    "stupidArtnet>=1.6",
    "watchdog>=6.0",
    "websocket-client>=1.9",        # SMILE: ComfyUI's events, the relay of SMILE Online
    # GPU stack (CUDA 13): moves only together with rebuilt TensorRT engines, never through `uv lock --upgrade`
    "torch==2.14.1",
    "tensorrt-cu13==11.4.0.106",
]

# depthai 2 and depthai 3 are the same package name, so an install holds one of them: `oak` is the
# OAK-D backend (White Space needs depthai 2; 2.30 is more stable than 2.32), `oak4` the OAK4 backend
# (modules/camera/oak4). `uv sync` installs `oak`; `scripts\install.bat oak4` installs `oak4` instead.
[dependency-groups]
oak = ["depthai==2.30.0"]
oak4 = ["depthai>=3.11", "depthai-nodes>=0.7"]

[tool.uv]
package = false
default-groups = ["oak"]
conflicts = [[{ group = "oak" }, { group = "oak4" }]]
# depthai-nodes asks for its own OpenCV (opencv-python-headless 4.10) beside the workspace's; a marker
# that is never true drops that one requirement, so one cv2 is installed.
override-dependencies = ["opencv-python-headless ; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Read by Pylance and the pyright CLI alike, so the Problems panel and a full scan report the same rules.
[tool.pyright]
include = ["apps", "modules", "tests", "tools", "scripts", "launcher.py"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "apps/smile/ComfyUI",               # third party, own .venv, gitignored
    "apps/smile/data/comfy",            # ComfyUI node, needs ComfyUI's imports
    "modules/camera/vimba/vimbapython", # vendored SDK
    "modules/camera/oak4",              # depthai 3 code: scan it against .venv-oak4
    "apps/oak4_test",                   # depthai 3 code: scan it against .venv-oak4
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
