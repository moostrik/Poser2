[platformio]
src_dir = .

[env:w5500_evb_pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5500_evb_pico
framework = arduino
lib_deps = khoih-prog/Ethernet_Generic
monitor_speed = 115200
; UF2 drag-and-drop upload. The default `picotool` protocol needs a WinUSB driver bound to the
; "RP2 Boot" interface (VID 2E8A / PID 0003 / MI_01), which Windows leaves unbound -- picotool then
; fails with "unable to connect ... install a driver via Zadig" even though the board IS in BOOTSEL.
; `mbed` uses the mass-storage interface instead: it copies firmware.uf2 to the RPI-RP2 drive.
upload_protocol = mbed