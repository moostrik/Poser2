<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SMILE</title>
  <!-- the page the relay serves at / without a valid pass (relay/server.py, the gate): the look of index.html,
       in one file, so a phone that scanned the code a day ago gets its answer without the page's script -->
  <style>
    @font-face { font-family: Bangers; src: url(web/Bangers-Regular.ttf) format("truetype"); font-display: block; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Bangers, Impact, sans-serif; letter-spacing: 0.03em; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    h1 { font-size: 2.6rem; font-weight: normal; margin: 0 0 0.4em; }
    p { font-size: 1.5rem; margin: 0; }
    /* the machine's mark, the ring with "ai" in it, as style.css draws it */
    .ai { display: inline-flex; align-items: center; justify-content: center; padding: 0.04em 0.06em 0 0; font-size: 0.5em;
          width: 1.5em; height: 1.5em; line-height: 1; margin: 0 0 0 0.4em; border: 0.12em solid currentColor; border-radius: 50%;
          letter-spacing: 0; text-align: center; text-transform: none; vertical-align: 0.9em; }
  </style>
</head>
<body>
  <div>
    <h1>THIS LINK HAS EXPIRED</h1>
    <p>Scan the code at SMILE<span class="ai">ai</span> again</p>
  </div>
</body>
</html>
